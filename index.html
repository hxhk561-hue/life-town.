</style></head><body><div id="app">

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
/* ห้องเล่นกับเพื่อน (ไม่พึ่ง Claude): ส่งข้อมูลผ่าน MQTT public broker แบบ WebSocket ใช้ได้ทั้ง iOS/Android */
(function(){
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
const ME=Math.random().toString(36).slice(2,10);
function connect(i,ms){return new Promise((res,rej)=>{
 if(!window.mqtt)return rej(new Error('mqtt not loaded'));
 let c,done=false;
 try{c=mqtt.connect(BROKERS[i],{clientId:'lt_'+ME+'_'+i,reconnectPeriod:0,connectTimeout:ms,clean:true,keepalive:30})}catch(e){return rej(e)}
 const t=setTimeout(()=>{if(!done){done=true;try{c.end(true)}catch(e){}rej(new Error('timeout'))}},ms+500);
 c.once('connect',()=>{if(!done){done=true;clearTimeout(t);res(c)}});
 c.once('error',e=>{if(!done){done=true;clearTimeout(t);try{c.end(true)}catch(_){}rej(e)}});
})}
async function join(name){
 let c=null;
 for(let i=0;i<BROKERS.length&&!c;i++){try{c=await connect(i,6000)}catch(e){}}
 if(!c)throw new Error('connect failed');
 c.options.reconnectPeriod=3000;
 const base='lifetown-v1/'+encodeURIComponent(name)+'/';
 const peers=new Map();let mine=null,cb=null,last='',lastT=0;
 const list=()=>[{peer:ME,isMe:true,presence:mine}].concat([...peers.values()]);
 const fire=()=>{if(cb)try{cb({peers:list()})}catch(e){console.error(e)}};
 c.subscribe(base+'+');
 c.on('connect',()=>{c.subscribe(base+'+');lastT=0});
 c.on('message',(t,m)=>{
  const id=t.slice(base.length);if(id===ME)return;
  let d;try{d=JSON.parse(m.toString())}catch(e){return}
  if(d.bye){if(peers.delete(id))fire();return}
  const e=peers.get(id);
  if(e){e.presence=d.p;e.at=Date.now()}else peers.set(id,{peer:id,isMe:false,presence:d.p,at:Date.now()});
  fire()});
 setInterval(()=>{let ch=false;const n=Date.now();peers.forEach((v,k)=>{if(n-v.at>7000){peers.delete(k);ch=true}});if(ch)fire()},1000);
 addEventListener('pagehide',()=>{try{c.publish(base+ME,JSON.stringify({bye:1}),{qos:0},()=>c.end(true))}catch(e){}});
 return{
  presence(o){mine=o;const j=JSON.stringify(o),n=Date.now();
   if(c.connected&&((j!==last&&n-lastT>=200)||n-lastT>=2000)){last=j;lastT=n;c.publish(base+ME,JSON.stringify({p:o}),{qos:0})}
   return Promise.resolve()},
  onPeers(f){cb=f;fire()}
 }}
window.claude={use:async k=>k==='room'?{join}:null};
})();
</script>
